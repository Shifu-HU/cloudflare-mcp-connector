# ============ Cloudflare API MCP (Code Mode) ============
# Token comes from the environment via !!js — never written to disk.
# Set CLOUDFLARE_API_TOKEN before starting the harness.
#
# Tool names follow mcp__<serverName>__<rawName>:
#   mcp__cloudflare__docs / __search / __execute
#
# Note: this endpoint mandates OAuth, and dsh-mcp-client does not do OAuth —
# a static Bearer token is the only working path.
- insert:
    - id: mcp-cloudflare
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cloudflare
        transport: streamable-http
        url: https://mcp.cloudflare.com/mcp
        headers:
          Authorization: !!js '`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`'
