# ============ Cloudflare API MCP（Code Mode）============
# 接入方式：把本段追加到 ~/.dsh/profiles/<profile>/cordis.patch.yml 的顶层列表末尾。
# 工具名规则：mcp__<serverName>__<rawName>，即 mcp__cloudflare__docs / __search / __execute。
#
# 令牌用 !!js 从环境变量读取，不落盘明文。启动 dsh 前先设好 CLOUDFLARE_API_TOKEN。
# （dsh 的 YAML 支持 !!js 标签；WorkBuddy 的 mcp.json 不支持占位符，那边只能明文。）
#
# 注意：该端点强制 OAuth，而 dsh-mcp-client 不走 OAuth —— 静态 Bearer Token 是唯一路径。
- id: mcp-cloudflare
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: cloudflare
    transport: streamable-http
    url: https://mcp.cloudflare.com/mcp
    headers:
      Authorization: !!js '`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`'
